<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ruiqing Yue — M.S. at UCAS, AI Agent and LLM Systems">
  <title>Ruiqing Yue — M.S. at UCAS, AI Agent &amp; LLM Systems</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1020"/>
      <stop offset="55%"  stop-color="#111a35"/>
      <stop offset="100%" stop-color="#1b1230"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.15" cy="0.18" r="0.62">
      <stop offset="0%"   stop-color="#4f8cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.88" cy="0.86" r="0.55">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4f8cff"/>
      <stop offset="50%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glowA)"/>
  <rect width="1200" height="300" fill="url(#glowB)"/>

  <!-- orbit rings -->
  <g fill="none" stroke="#ffffff" stroke-width="1">
    <circle cx="1006" cy="150" r="116" stroke-opacity="0.07"/>
    <circle cx="1006" cy="150" r="84"  stroke-opacity="0.09"/>
    <circle cx="1006" cy="150" r="52"  stroke-opacity="0.11"/>
  </g>

  <!-- orbiting nodes -->
  <g>
    <circle cx="1006" cy="34" r="4.5" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1122" cy="150" r="3.5" fill="#60a5fa">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="922" cy="92" r="3.5" fill="#a855f7">
      <animate attributeName="opacity" values="1;0.4;1" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="212" r="3" fill="#818cf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- name -->
  <text x="72" y="126"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="60" font-weight="700" fill="url(#nameFill)" letter-spacing="0.4">Ruiqing Yue</text>


  <!-- tagline -->
  <text x="74" y="186"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="400" fill="#cbd5e1">M.S. @ UCAS  ·  AI Agent &amp; LLM Systems</text>

  <!-- accent rule with travelling highlight -->
  <rect x="74" y="208" width="230" height="3" rx="1.5" fill="url(#rule)" opacity="0.85"/>
  <rect x="74" y="208" width="54" height="3" rx="1.5" fill="#ffffff" opacity="0.55">
    <animate attributeName="x" values="74;250;74" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- keywords -->
  <text x="74" y="248"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="14.5" fill="#7c8db5">Multi-Agent Systems   ·   LLM Engineering   ·   Inference Acceleration</text>
</svg>
